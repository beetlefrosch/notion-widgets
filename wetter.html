<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wetter</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --day-bg: #f7f7f5;
    --icon: #8a8a87;
    --sun: #f5a623;
    --rain: #4a90d9;
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --text: #e6e6e4;
    --muted: #9b9b98;
    --day-bg: #252525;
    --icon: #a5a5a2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 8px;
  }
  .now {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }
  .place b { display: block; font-size: 14px; }
  .place span, .cond { font-size: 13px; color: var(--muted); }
  .temp { font-size: 30px; line-height: 1.1; }
  .now svg { width: 56px; height: 56px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .day { text-align: center; padding: 8px 2px; font-size: 13px; }
  .day:nth-child(odd) { background: var(--day-bg); }
  .day svg { display: block; width: 30px; height: 30px; margin: 6px auto 4px; }
  .max { display: block; }
  .min { display: block; color: var(--muted); }
  .err { text-align: center; color: var(--muted); font-size: 13px; }
  svg { stroke: var(--icon); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg .sun { stroke: var(--sun); }
  svg .rain { stroke: var(--rain); }
</style>
</head>
<body>
<div class="now">
  <div class="place"><b id="name">…</b><span>Wetter</span></div>
  <div id="nowIcon"></div>
  <div><div class="temp" id="temp">–</div><div class="cond" id="cond"></div></div>
</div>
<div class="days" id="days"></div>

<script>
// Parameter: ?name=Lichtenstein/Sa.&lat=50.757&lon=12.631&theme=dark
const p = new URLSearchParams(location.search);
const NAME = p.get("name") || "Lichtenstein/Sa.";
const LAT = p.get("lat") || "50.757";
const LON = p.get("lon") || "12.631";
if (p.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
document.getElementById("name").textContent = NAME;

// WMO-Wettercodes (Open-Meteo) -> Text und Symbol
function describe(code) {
  if (code === 0) return ["Klar", "sun"];
  if (code === 1) return ["Überwiegend klar", "sun"];
  if (code === 2) return ["Teilweise bewölkt", "partly"];
  if (code === 3) return ["Bedeckt", "cloud"];
  if (code === 45 || code === 48) return ["Nebel", "fog"];
  if (code >= 51 && code <= 57) return ["Nieselregen", "rain"];
  if (code >= 61 && code <= 67) return ["Regen", "rain"];
  if (code >= 71 && code <= 77) return ["Schnee", "snow"];
  if (code >= 80 && code <= 82) return ["Regenschauer", "rain"];
  if (code === 85 || code === 86) return ["Schneeschauer", "snow"];
  if (code >= 95) return ["Gewitter", "storm"];
  return ["Unbekannt", "cloud"];
}

const CLOUD = '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.1 3.5 3.5 0 0 0 7 18z"/>';
const ICONS = {
  sun: '<g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>',
  partly: '<g class="sun"><circle cx="9" cy="8" r="3"/><path d="M9 2v1.5M3 8h1.5M4.8 3.8l1 1M13.2 3.8l-1 1"/></g><path d="M8 20h9a3.5 3.5 0 0 0 .4-6.97A5 5 0 0 0 8 13.6 3.2 3.2 0 0 0 8 20z"/>',
  cloud: CLOUD,
  fog: '<path d="M4 9h16M4 13h16M6 17h12"/>',
  rain: '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.1 3.5 3.5 0 0 0 7 15z"/><path class="rain" d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>',
  snow: '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.1 3.5 3.5 0 0 0 7 15z"/><path d="M9 19h.01M13 21h.01M17 19h.01" stroke-width="3"/>',
  storm: '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.1 3.5 3.5 0 0 0 7 15z"/><path class="sun" d="M13 15l-2 4h3l-2 4"/>',
};
const svg = kind => `<svg viewBox="0 0 24 24">${ICONS[kind]}</svg>`;
const WEEKDAY = new Intl.DateTimeFormat("de-DE", { weekday: "short" });

async function load() {
  const url = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${LAT}&longitude=${LON}`
    + "&current=temperature_2m,weather_code"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min"
    + "&timezone=Europe%2FBerlin&forecast_days=7";
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();

    const [text, kind] = describe(d.current.weather_code);
    document.getElementById("temp").textContent = Math.round(d.current.temperature_2m) + "°C";
    document.getElementById("cond").textContent = text;
    document.getElementById("nowIcon").innerHTML = svg(kind);

    document.getElementById("days").innerHTML = d.daily.time.map((t, i) => {
      const [label, k] = describe(d.daily.weather_code[i]);
      return `<div class="day" title="${label}">
        ${WEEKDAY.format(new Date(t + "T12:00"))}
        ${svg(k)}
        <span class="max">${Math.round(d.daily.temperature_2m_max[i])}°</span>
        <span class="min">${Math.round(d.daily.temperature_2m_min[i])}°</span>
      </div>`;
    }).join("");
  } catch (e) {
    document.getElementById("days").innerHTML = '<div class="err" style="grid-column:1/-1">Wetterdaten nicht erreichbar, neuer Versuch in 15 Minuten.</div>';
  }
}

load();
setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
